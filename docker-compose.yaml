services:
  node1:
    image: hyperledger/besu:26.8.1
    container_name: bft_node1
    restart: unless-stopped
    volumes:
      - ./config/networkFiles:/config/networkFiles:ro
    command:
      - "--data-path=/opt/besu/data"
      - "--genesis-file=/config/networkFiles/genesis.json"
      - "--node-private-key-file=/config/networkFiles/keys/0x05f7d16757ef0fd5ef0dbe093fa4b92da69d8387/key"
      - "--static-nodes-file=/config/networkFiles/static-nodes.json"
      - "--p2p-host=172.16.239.10"
      - "--p2p-port=30303"
      - "--rpc-http-enabled=true"
      - "--rpc-http-api=ETH,NET,WEB3,TXPOOL,QBFT"
      - "--rpc-http-host=0.0.0.0"
      - "--rpc-http-port=8545"
      - "--rpc-http-cors-origins=*"
      - "--host-allowlist=*"
      - "--tx-pool-max-future-by-sender=1000"
    ports:
      - "127.0.0.1:8545:8545"
    networks:
      besu_net:
        ipv4_address: 172.16.239.10

  node2:
